[package]
name = "typdown-typst"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
typst = "0.15.0"
typst-assets = "0.15.0"
typst-kit = "0.15.0"
typst-layout = "0.15.0"
typst-svg = "0.15.0"

[profile.release]
lto = "thin"
opt-level = 3
strip = true

[profile.small]
inherits = "release"
opt-level = "s"

[features]
default = ["typst-kit/scan-fonts"]
embedded-fonts = ["typst-kit/embedded-fonts"]
