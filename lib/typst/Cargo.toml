[package]
name = "typdown-typst"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
typst = "0.14.2"
typst-kit = "0.14.2"
typst-svg = "0.14.2"

[profile.release]
lto = "thin"
opt-level = 3
strip = true

[profile.small]
inherits = "release"
opt-level = "s"

[features]
default = ["embed-fonts"]

embed-fonts = ["typst-kit/embed-fonts"]
